<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Extract and reuse optimization skills</title>
  <desc id="desc">Init adapts expert input into an expert kernel. Decompose returns a predecessor and saves a SkillCard when the implementation changes. A controller may request another Decompose round. Apply takes a target kernel and optional memory to produce a validated candidate.</desc>
  <defs>
    <style>
      :root { --paper:#f8fbff; --surface:#ffffff; --ink:#1b2d43; --muted:#5e728b; --rule:#b9ccdf; --grid:#dce8f3; --blue:#3377cc; --violet:#7b61b5; --green:#26846b; --amber:#b37b37; }
      @media(prefers-color-scheme:dark) { :root { --paper:#152233; --surface:#1b2b40; --ink:#e5edf7; --muted:#a0b6cf; --rule:#526982; --grid:#293c52; --blue:#83b7f1; --violet:#b3a0e2; --green:#82cbb4; --amber:#e5bd83; } }
      text { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); text-rendering:geometricPrecision; }
      .title { font-size:20px; font-weight:650; }
      .body { font-size:16px; fill:var(--muted); }
      .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:15px; }
      .label { font-size:14px; fill:var(--muted); paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round; }
      .eyebrow { font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; letter-spacing:1.25px; fill:var(--muted); }
      .paper { fill:var(--paper); }
      .surface { fill:var(--surface); stroke:var(--rule); stroke-width:1.3; }
      .plate { fill:var(--blue); fill-opacity:.035; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 5; }
      .wire { fill:none; stroke:var(--rule); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .return { stroke-dasharray:4 5; }
      .blue { color:var(--blue); }
      .violet { color:var(--violet); }
      .green { color:var(--green); }
      .amber { color:var(--amber); }
      .tone { fill:currentColor; }
      .trace { fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
      .disc { fill:var(--surface); stroke:currentColor; stroke-width:1.7; }
      .halo { fill:currentColor; fill-opacity:.065; }
      .rule { fill:none; stroke:var(--rule); stroke-width:1; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 H 0 V 20" fill="none" stroke="var(--grid)" stroke-width=".65"/></pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#grid)"/><path d="M 100 0 H 0 V 100" fill="none" stroke="var(--grid)" stroke-width="1.1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/></marker>
    <g id="terminal" class="trace"><path d="m -10 -7 7 7 -7 7 M 2 7 H 11"/></g>
    <g id="chip" class="trace"><rect x="-23" y="-23" width="46" height="46" rx="3"/><rect x="-12" y="-12" width="24" height="24" rx="1"/><path d="M -13 -23 V -32 M 0 -23 V -32 M 13 -23 V -32 M -13 23 V 32 M 0 23 V 32 M 13 23 V 32 M -23 -13 H -32 M -23 0 H -32 M -23 13 H -32 M 23 -13 H 32 M 23 0 H 32 M 23 13 H 32"/></g>
    <g id="file" class="trace"><path d="M -13 -18 H 5 L 13 -10 V 18 H -13 Z M 5 -18 V -10 H 13 M -6 -1 H 6 M -6 6 H 6"/></g>
    <g id="check" class="trace"><path d="m -8 0 5 5 11 -11"/></g>
    <g id="braces" class="trace"><path d="M -5 -12 H -9 V -4 L -13 0 -9 4 V 12 H -5 M 5 -12 H 9 V -4 L 13 0 9 4 V 12 H 5"/></g>
  </defs>
  <rect class="paper" width="800" height="400" rx="10"/>
  <rect width="800" height="400" rx="10" fill="url(#major)"/>
  <text class="mono" x="28" y="32">01 / EXTRACT</text>

  <path class="surface" d="M 38 71 H 105 L 119 85 V 132 H 38 Z"/>
  <path class="rule" d="M 105 71 V 85 H 119 M 52 96 H 103 M 52 107 H 92 M 52 118 H 101"/>
  <text class="title" x="78" y="159" text-anchor="middle">Expert input</text>
  <text class="body" x="78" y="180" text-anchor="middle">Problem + repo</text>
  <path class="wire" d="M 122 103 H 201"/>

  <g class="blue" transform="translate(234 103)">
    <circle class="halo" r="40"/><circle class="disc" r="29"/>
    <use href="#terminal"/>
  </g>
  <text class="title" x="234" y="159" text-anchor="middle">Init</text>
  <text class="body" x="234" y="180" text-anchor="middle">Expert kernel</text>
  <path class="wire" d="M 267 103 H 408"/>

  <g class="violet" transform="translate(441 103)">
    <circle class="halo" r="40"/><circle class="disc" r="29"/>
    <use href="#braces"/>
  </g>
  <text class="title" x="441" y="159" text-anchor="middle">Decompose</text>
  <text class="body" x="441" y="180" text-anchor="middle">Predecessor kernel</text>
  <path class="wire return" d="M 465 80 L 485 63 V 47 H 397 V 64 L 417 80"/>
  <text class="label" x="441" y="32" text-anchor="middle">Controller may repeat</text>
  <path class="wire" d="M 474 103 H 648"/>
  <text class="label" x="560" y="90" text-anchor="middle">when changed</text>

  <path class="surface" d="M 668 77 H 710 V 129 H 668 Z"/>
  <path class="surface" d="M 661 72 H 703 V 124 H 661 Z"/>
  <path class="surface" d="M 654 67 H 682 L 696 81 V 119 H 654 Z"/>
  <path class="rule" d="M 682 67 V 81 H 696 M 663 92 H 686 M 663 103 H 682"/>
  <text class="title" x="682" y="159" text-anchor="middle">Memory</text>
  <text class="mono" x="682" y="180" text-anchor="middle">SKILL.md</text>

  <path class="rule" d="M 28 204 H 330"/>
  <text class="mono" x="28" y="238">02 / REUSE</text>
  <path class="wire return" d="M 714 103 H 749 V 224 H 462 Q 441 224 441 245 V 258"/>
  <text class="label" x="594" y="213" text-anchor="middle">optional memory</text>

  <g class="blue" transform="translate(118 291)"><use href="#file" transform="scale(1.4)"/></g>
  <text class="title" x="118" y="343" text-anchor="middle">Target kernel</text>
  <text class="body" x="118" y="365" text-anchor="middle">or source-free</text>
  <path class="wire" d="M 142 291 H 408"/>
  <text class="label" x="275" y="278" text-anchor="middle">implementation</text>

  <g class="green" transform="translate(441 291)">
    <circle class="halo" r="40"/><circle class="disc" r="29"/>
    <use href="#terminal"/>
  </g>
  <text class="title" x="441" y="343" text-anchor="middle">Apply</text>
  <text class="body" x="441" y="365" text-anchor="middle">One round</text>
  <path class="wire" d="M 474 291 H 651"/>
  <text class="label" x="559" y="278" text-anchor="middle">evaluate</text>

  <path class="surface" d="M 657 265 H 683 L 697 279 V 317 H 657 Z"/>
  <path class="rule" d="M 683 265 V 279 H 697"/>
  <g class="green" transform="translate(677 297)"><use href="#check"/></g>
  <text class="title" x="677" y="343" text-anchor="middle">Candidate</text>
  <text class="body" x="677" y="365" text-anchor="middle">Validated kernel</text>
</svg>

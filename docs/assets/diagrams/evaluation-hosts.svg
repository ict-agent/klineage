<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation boundaries and problem-set access</title>
  <desc id="desc">An agent Client submits sources through a Unix gateway on the controller host. The gateway exposes only its registered problem set. The evaluation service owns problems, policy and job records. An isolated device worker builds, checks and times kernels; service records remain outside that worker.</desc>
  <defs>
    <style>
      :root { --paper:#f8fbff; --surface:#ffffff; --ink:#1b2d43; --muted:#5e728b; --rule:#b9ccdf; --grid:#dce8f3; --blue:#3377cc; --violet:#7b61b5; --green:#26846b; --amber:#b37b37; }
      @media(prefers-color-scheme:dark) { :root { --paper:#152233; --surface:#1b2b40; --ink:#e5edf7; --muted:#a0b6cf; --rule:#526982; --grid:#293c52; --blue:#83b7f1; --violet:#b3a0e2; --green:#82cbb4; --amber:#e5bd83; } }
      text { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); text-rendering:geometricPrecision; }
      .title { font-size:20px; font-weight:650; }
      .body { font-size:16px; fill:var(--muted); }
      .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:15px; }
      .label { font-size:14px; fill:var(--muted); paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round; }
      .eyebrow { font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; letter-spacing:1.25px; fill:var(--muted); }
      .paper { fill:var(--paper); }
      .surface { fill:var(--surface); stroke:var(--rule); stroke-width:1.3; }
      .plate { fill:var(--blue); fill-opacity:.035; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 5; }
      .wire { fill:none; stroke:var(--rule); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .return { stroke-dasharray:4 5; }
      .blue { color:var(--blue); }
      .violet { color:var(--violet); }
      .green { color:var(--green); }
      .amber { color:var(--amber); }
      .tone { fill:currentColor; }
      .trace { fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
      .disc { fill:var(--surface); stroke:currentColor; stroke-width:1.7; }
      .halo { fill:currentColor; fill-opacity:.065; }
      .rule { fill:none; stroke:var(--rule); stroke-width:1; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 H 0 V 20" fill="none" stroke="var(--grid)" stroke-width=".65"/></pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#grid)"/><path d="M 100 0 H 0 V 100" fill="none" stroke="var(--grid)" stroke-width="1.1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/></marker>
    <g id="terminal" class="trace"><path d="m -10 -7 7 7 -7 7 M 2 7 H 11"/></g>
    <g id="chip" class="trace"><rect x="-23" y="-23" width="46" height="46" rx="3"/><rect x="-12" y="-12" width="24" height="24" rx="1"/><path d="M -13 -23 V -32 M 0 -23 V -32 M 13 -23 V -32 M -13 23 V 32 M 0 23 V 32 M 13 23 V 32 M -23 -13 H -32 M -23 0 H -32 M -23 13 H -32 M 23 -13 H 32 M 23 0 H 32 M 23 13 H 32"/></g>
    <g id="file" class="trace"><path d="M -13 -18 H 5 L 13 -10 V 18 H -13 Z M 5 -18 V -10 H 13 M -6 -1 H 6 M -6 6 H 6"/></g>
    <g id="check" class="trace"><path d="m -8 0 5 5 11 -11"/></g>
    <g id="braces" class="trace"><path d="M -5 -12 H -9 V -4 L -13 0 -9 4 V 12 H -5 M 5 -12 H 9 V -4 L 13 0 9 4 V 12 H 5"/></g>
  </defs>
  <rect class="paper" width="800" height="420" rx="10"/>
  <rect width="800" height="420" rx="10" fill="url(#major)"/>
  <text class="mono" x="28" y="32">EVALUATION / ACCESS BOUNDARIES</text>

  <rect class="plate" x="24" y="54" width="205" height="330" rx="2"/>
  <rect class="plate" x="250" y="54" width="226" height="330" rx="2"/>
  <rect class="plate" x="497" y="54" width="279" height="330" rx="2"/>
  <text class="title" x="42" y="84" style="font-size:18px">Agent sandbox</text>
  <text class="title" x="270" y="84" style="font-size:18px">Controller host</text>
  <text class="title" x="517" y="84" style="font-size:18px">Evaluation host</text>

  <g class="blue" transform="translate(126 145)">
    <circle class="halo" r="40"/><circle class="disc" r="29"/>
    <use href="#terminal"/>
  </g>
  <text class="mono" x="126" y="195" text-anchor="middle">Client</text>
  <text class="mono" x="126" y="218" text-anchor="middle">evaluate(...)</text>
  <g class="blue" transform="translate(56 270)"><use href="#file"/></g>
  <text class="mono" x="82" y="265">current_kernel/</text>
  <text class="mono" x="82" y="287">sources</text>
  <text class="body" x="42" y="332">Private network</text>
  <text class="body" x="42" y="354">Unix socket only</text>
  <path class="wire" d="M 159 145 H 330"/>
  <text class="label" x="244" y="132" text-anchor="middle">source text</text>

  <g class="violet" transform="translate(363 145)">
    <circle class="halo" r="40"/><circle class="disc" r="29"/>
    <path class="trace" d="M -13 0 H 13 M 3 -10 L 13 0 3 10"/>
  </g>
  <text class="title" x="363" y="195" text-anchor="middle">Unix gateway</text>
  <text class="mono" x="363" y="218" text-anchor="middle">ClientGateway</text>
  <text class="body" x="363" y="255" text-anchor="middle">Allowed set</text>
  <g class="violet"><path class="trace" d="M 291 269 H 285 V 303 H 291 M 435 269 H 441 V 303 H 435"/></g>
  <text class="mono" x="363" y="291" text-anchor="middle">problem IDs</text>
  <text class="body" x="363" y="334" text-anchor="middle">Fixed for this run</text>
  <path class="wire" d="M 396 145 H 522"/>
  <text class="label" x="458" y="132" text-anchor="middle">service API</text>

  <rect class="surface" x="526" y="110" width="223" height="105" rx="2"/>
  <path d="M 526 111 H 749" stroke="var(--violet)" stroke-width="3"/>
  <circle cx="733" cy="127" r="3" fill="var(--violet)"/>
  <text class="title" x="546" y="140">Service</text>
  <text class="mono" x="546" y="167">Policy · queue</text>
  <text class="body" x="546" y="193">Registered problems</text>

  <path class="wire" d="M 566 217 V 244"/>
  <path class="surface" d="M 555 250 H 591 V 293 H 555 Z"/>
  <path class="surface" d="M 550 255 H 586 V 298 H 550 Z"/>
  <path class="surface" d="M 545 260 H 581 V 303 H 545 Z"/>
  <path class="rule" d="M 553 273 H 573 M 553 282 H 573 M 553 291 H 568"/>
  <text class="title" x="565" y="328" text-anchor="middle">Records</text>
  <text class="mono" x="565" y="351" text-anchor="middle">jobs / logs</text>
  <text class="label" x="565" y="374" text-anchor="middle">outside worker</text>

  <rect class="plate" x="625" y="245" width="132" height="130" rx="2"/>
  <text class="body" x="691" y="264" text-anchor="middle">Isolated worker</text>
  <g class="amber" transform="translate(691 300)"><use href="#chip"/></g>
  <text class="body" x="691" y="352" text-anchor="middle">Build · check</text>
  <text class="body" x="691" y="370" text-anchor="middle">Time</text>
  <path class="wire" d="M 714 217 V 232 H 766 V 300 H 726"/>
  <path class="wire return" d="M 655 300 H 613 V 226 H 634 V 218"/>

  <text class="label" x="28" y="409">Controller and evaluation host may share a machine.</text>
</svg>

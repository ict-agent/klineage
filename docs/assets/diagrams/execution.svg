<svg xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 0 800 392" role="img" aria-labelledby="title desc">
<title id="title">Kernel generation and evaluation</title>
<desc id="desc">A problem supplies Apply with a definition and workloads. Apply queries procedural memory for reusable optimization knowledge and submits a kernel artifact to the evaluation service. An isolated backend worker builds, checks and times it. The service returns performance feedback to Apply.</desc>
  <defs>
    <style>
      :root { --paper:#f8fbff; --surface:#ffffff; --ink:#1b2d43; --muted:#5e728b; --rule:#b9ccdf; --grid:#dce8f3; --blue:#3377cc; --violet:#7b61b5; --green:#26846b; --amber:#b37b37; }
      @media(prefers-color-scheme:dark) { :root { --paper:#152233; --surface:#1b2b40; --ink:#e5edf7; --muted:#a0b6cf; --rule:#526982; --grid:#293c52; --blue:#83b7f1; --violet:#b3a0e2; --green:#82cbb4; --amber:#e5bd83; } }
      text { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); text-rendering:geometricPrecision; }
      .title { font-size:20px; font-weight:650; }
      .body { font-size:16px; fill:var(--muted); }
      .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:15px; }
      .label { font-size:14px; fill:var(--muted); paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round; }
      .eyebrow { font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; letter-spacing:1.25px; fill:var(--muted); }
      .paper { fill:var(--paper); }
      .surface { fill:var(--surface); stroke:var(--rule); stroke-width:1.3; }
      .plate { fill:var(--blue); fill-opacity:.035; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 5; }
      .wire { fill:none; stroke:var(--rule); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .return { stroke-dasharray:4 5; }
      .blue { color:var(--blue); }
      .violet { color:var(--violet); }
      .green { color:var(--green); }
      .amber { color:var(--amber); }
      .tone { fill:currentColor; }
      .trace { fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
      .disc { fill:var(--surface); stroke:currentColor; stroke-width:1.7; }
      .halo { fill:currentColor; fill-opacity:.065; }
      .rule { fill:none; stroke:var(--rule); stroke-width:1; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 H 0 V 20" fill="none" stroke="var(--grid)" stroke-width=".65"/></pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#grid)"/><path d="M 100 0 H 0 V 100" fill="none" stroke="var(--grid)" stroke-width="1.1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/></marker>
    <g id="terminal" class="trace"><path d="m -10 -7 7 7 -7 7 M 2 7 H 11"/></g>
    <g id="chip" class="trace"><rect x="-23" y="-23" width="46" height="46" rx="3"/><rect x="-12" y="-12" width="24" height="24" rx="1"/><path d="M -13 -23 V -32 M 0 -23 V -32 M 13 -23 V -32 M -13 23 V 32 M 0 23 V 32 M 13 23 V 32 M -23 -13 H -32 M -23 0 H -32 M -23 13 H -32 M 23 -13 H 32 M 23 0 H 32 M 23 13 H 32"/></g>
    <g id="file" class="trace"><path d="M -13 -18 H 5 L 13 -10 V 18 H -13 Z M 5 -18 V -10 H 13 M -6 -1 H 6 M -6 6 H 6"/></g>
    <g id="check" class="trace"><path d="m -8 0 5 5 11 -11"/></g>
    <g id="braces" class="trace"><path d="M -5 -12 H -9 V -4 L -13 0 -9 4 V 12 H -5 M 5 -12 H 9 V -4 L 13 0 9 4 V 12 H 5"/></g>
  </defs>

  <rect class="paper" width="800" height="392" rx="10"/>
  <rect width="800" height="392" rx="10" fill="url(#major)"/>
  <text class="eyebrow" x="28" y="32">KLINEAGE / GENERATE → EVALUATE → REFINE</text>
  <rect class="plate" x="180" y="74" width="124" height="197" rx="2"/>
  <text class="eyebrow" x="242" y="99" text-anchor="middle">AGENT</text>
  <rect class="plate" x="598" y="74" width="174" height="213" rx="2"/>
  <text class="eyebrow" x="685" y="99" text-anchor="middle">DEVICE WORKER</text>

  <path class="surface" d="M 32 135 H 131 L 148 152 V 240 H 32 Z"/>
  <path class="rule" d="M 131 135 V 152 H 148"/>
  <text class="mono" x="47" y="177">definition</text>
  <path class="rule" d="M 47 190 H 130"/>
  <text class="mono" x="47" y="217">workloads</text>
  <text class="title" x="90" y="269" text-anchor="middle">Problem</text>
  <path class="wire" d="M 150 183 H 203"/>

  <g class="blue" transform="translate(242 183)">
    <circle class="halo" r="43"/><circle class="disc" r="31"/>
    <use href="#terminal"/>
  </g>
  <text class="title" x="242" y="240" text-anchor="middle">Apply</text>
  <text class="body" x="242" y="259" text-anchor="middle">CodexRunner</text>
  <path class="wire" d="M 276 183 H 408"/>
  <text class="label" x="342" y="170" text-anchor="middle">kernel artifact</text>

  <text class="title" x="448" y="111" text-anchor="middle">Evaluation service</text>
  <g class="violet">
    <rect class="disc" x="412" y="138" width="72" height="24" rx="3"/>
    <rect class="disc" x="412" y="171" width="72" height="24" rx="3"/>
    <rect class="disc" x="412" y="204" width="72" height="24" rx="3"/>
    <circle class="tone" cx="422" cy="150" r="2.5"/>
    <circle class="tone" cx="422" cy="183" r="2.5"/>
    <circle class="tone" cx="422" cy="216" r="2.5"/>
    <path class="trace" d="M 447 150 H 472 M 447 183 H 472 M 447 216 H 472"/>
  </g>
  <path class="wire" d="M 488 183 H 647"/>
  <text class="label" x="569" y="170" text-anchor="middle">job</text>

  <g class="amber" transform="translate(685 183)"><use href="#chip"/></g>
  <text class="title" x="685" y="241" text-anchor="middle">Backend</text>
  <text class="body" x="685" y="265" text-anchor="middle">Build · check · time</text>

  <path class="wire return" d="M 720 183 H 774 Q 785 183 785 194 V 298 Q 785 309 774 309 H 469 Q 458 309 458 298 V 232"/>
  <text class="label" x="572" y="299" text-anchor="middle">measurements</text>
  <path class="wire" d="M 426 232 V 326 Q 426 337 415 337 H 253 Q 242 337 242 326 V 275"/>
  <text class="label" x="334" y="323" text-anchor="middle">performance feedback</text>

  <path class="surface" d="M 74 289 H 113 V 321 H 74 Z"/>
  <path class="surface" d="M 68 294 H 107 V 326 H 68 Z"/>
  <path class="surface" d="M 62 299 H 101 V 331 H 62 Z"/>
  <g class="violet"><path class="trace" d="M 70 309 H 92 M 70 317 H 86"/></g>
  <text class="title" x="91" y="355" text-anchor="middle">Procedural</text>
  <text class="title" x="91" y="377" text-anchor="middle">memory</text>
  <path class="wire" marker-start="url(#arrow)" d="M 117 309 H 175 Q 186 309 186 298 V 221 Q 186 210 197 210 H 215"/>
</svg>

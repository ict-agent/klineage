site_name: KLineage
site_url: https://qiuchu.site/project/klineage/
site_description: Artifact trees, reusable optimization skills, and measured accelerator kernels.
repo_url: https://github.com/ict-agent/klineage
repo_name: ict-agent/klineage
edit_uri: ""
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true
watch:
  - src/klineage

extra_css:
  - assets/stylesheets/diagrams.css

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/file-tree
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Design:
      - Artifact: concepts/artifacts.md
      - Action Primitive: concepts/actions.md
      - Accelerator Backend: concepts/backends.md
  - Guides:
      - Evaluation guide: guides/evaluation.md
      - Command-line tools: guides/cli.md
      - Extension guide: guides/extending.md
  - API reference:
      - Artifacts: reference/artifacts.md
      - Actions: reference/actions.md
      - Backends and timing: reference/backends.md
      - Evaluation service: reference/server.md
      - Agent runtime: reference/runtime.md
      - Skill memory: reference/memory.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: google
            docstring_options:
              returns_named_value: false
            docstring_section_style: table
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_source: false
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn

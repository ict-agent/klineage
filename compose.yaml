name: klineage

services:
  dev:
    container_name: klineage-cutlass-e2e
    image: klineage-dev:cuda13.0-pytorch2.11
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        BASE_IMAGE: pytorch/pytorch:2.11.0-cuda13.0-cudnn9-devel
        CODEX_CLI_VERSION: "0.149.0"
        KLINEAGE_UID: "${KLINEAGE_UID:-1000}"
        KLINEAGE_GID: "${KLINEAGE_GID:-1000}"
    network_mode: host
    stdin_open: true
    tty: true
    shm_size: 16gb
    security_opt:
      # Nested bubblewrap needs unshare plus mount-propagation operations.
      # The container remains non-root and unprivileged; Codex then applies
      # its inner filesystem policy to agent commands.
      - seccomp=unconfined
      - apparmor=unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    working_dir: /workspace/klineage
    volumes:
      - type: bind
        source: .
        target: /workspace/klineage
      - type: volume
        source: codex-home
        target: /home/klineage/.codex
      - type: volume
        source: uv-cache
        target: /home/klineage/.cache/uv
    command: bash

volumes:
  codex-home:
  uv-cache:

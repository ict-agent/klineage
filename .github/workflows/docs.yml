name: Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - src/klineage/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
      - .github/deploy-docs.sh
      - .github/docs_known_hosts
  pull_request:
    paths:
      - docs/**
      - src/klineage/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
      - .github/deploy-docs.sh
      - .github/docs_known_hosts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: Build documentation
        run: uv run --frozen --only-group docs mkdocs build --strict
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'ict-agent/klineage'
        env:
          DOCS_SSH_PRIVATE_KEY: ${{ secrets.DOCS_SSH_PRIVATE_KEY }}
        run: bash .github/deploy-docs.sh
